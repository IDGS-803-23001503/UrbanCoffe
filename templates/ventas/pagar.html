<script src="https://cdn.tailwindcss.com"></script>
<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-900 via-gray-800 to-slate-900 p-4">
    
    <div class="bg-white/95 backdrop-blur-md w-full max-w-md rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)] overflow-hidden border border-white/20">
        
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="inline-block p-4 rounded-full bg-amber-100 mb-4 text-amber-600">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                </div>
                <h2 class="text-3xl font-black text-gray-800 tracking-tight">Finalizar Cobro</h2>
                <p class="text-gray-500 font-medium">Venta #{{ idVenta }}</p>
            </div>

            <div class="bg-slate-900 rounded-3xl p-6 mb-8 text-center shadow-lg transform hover:scale-105 transition-transform">
                <p class="text-amber-400 text-xs uppercase font-bold tracking-[0.2em] mb-1">Total a Pagar</p>
                <h3 class="text-white text-5xl font-black">${{ "{:,.2f}".format(total) }}</h3>
            </div>

            <form method="POST" action="{{ url_for('ventas.pagar_venta_gestion', idVenta=idVenta) }}" id="pagoForm">
                {{ form.hidden_tag() }}
                
                <div class="space-y-4 mb-8">
                    <p class="text-sm font-bold text-gray-400 uppercase ml-2">Selecciona el método</p>
                    
                    <button type="submit" name="metodo_pago" value="Efectivo" 
                        class="w-full group flex items-center justify-between p-4 bg-gray-50 hover:bg-green-50 border-2 border-transparent hover:border-green-500 rounded-2xl transition-all">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-white rounded-xl shadow-sm group-hover:bg-green-500 group-hover:text-white transition-colors">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                            <div class="text-left">
                                <span class="block font-bold text-gray-800">Efectivo</span>
                                <span class="text-xs text-gray-500">Pago inmediato en caja</span>
                            </div>
                        </div>
                        <svg class="w-5 h-5 text-gray-300 group-hover:text-green-500" fill="currentColor" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg>
                    </button>

                    <button type="button" onclick="mostrarReferencia()"
                        class="w-full group flex items-center justify-between p-4 bg-gray-50 hover:bg-blue-50 border-2 border-transparent hover:border-blue-500 rounded-2xl transition-all">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-white rounded-xl shadow-sm group-hover:bg-blue-500 group-hover:text-white transition-colors">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            </div>
                            <div class="text-left">
                                <span class="block font-bold text-gray-800">Tarjeta Débito/Crédito</span>
                                <span class="text-xs text-gray-500">Usar terminal bancaria</span>
                            </div>
                        </div>
                    </button>
                </div>

                <div id="seccionReferencia" class="hidden mb-6 animate-bounce">
                    <label class="text-xs font-bold text-blue-600 uppercase ml-2">Folio de Autorización</label>
                    <input type="text" name="notas" placeholder="Ej: 009283" 
                        class="w-full mt-1 border-2 border-blue-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none bg-blue-50/50">
                    <button type="submit" name="metodo_pago" value="Tarjeta" class="w-full mt-3 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-200">
                        Confirmar Pago con Tarjeta
                    </button>
                </div>

                <div class="flex items-center justify-between mt-8">
                    <a href="{{ url_for('ventas.fisica') }}" class="text-gray-400 hover:text-red-500 font-bold text-sm transition-colors flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function mostrarReferencia() {
    const sec = document.getElementById('seccionReferencia');
    sec.classList.remove('hidden');
    sec.scrollIntoView({ behavior: 'smooth' });
}
</script>
