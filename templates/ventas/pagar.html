<script src="https://cdn.tailwindcss.com"></script>
<div class="flex items-center justify-center min-h-screen bg-gray-900/10 backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden border border-white">
        <div class="p-8">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-gray-800">Procesar Pago</h2>
                <span class="text-amber-800 font-black text-xl">ID #{{ idVenta }}</span>
            </div>

            <form method="POST" action="{{ url_for('ventas.pagar', idVenta=idVenta) }}">
                {{ form.hidden_tag() }}
                
                <p class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Selecciona Método</p>
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <label class="cursor-pointer group">
                        <input type="radio" name="metodo_pago" value="Efectivo" class="hidden peer" required>
                        <div class="flex flex-col items-center p-6 rounded-3xl border-2 border-gray-100 peer-checked:border-amber-600 peer-checked:bg-amber-50 group-hover:bg-gray-50 transition-all">
                            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-3">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                            </div>
                            <span class="font-bold text-gray-700">Efectivo</span>
                        </div>
                    </label>

                    <label class="cursor-pointer group">
                        <input type="radio" name="metodo_pago" value="Tarjeta" class="hidden peer">
                        <div class="flex flex-col items-center p-6 rounded-3xl border-2 border-gray-100 peer-checked:border-amber-600 peer-checked:bg-amber-50 group-hover:bg-gray-50 transition-all">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-3">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                            </div>
                            <span class="font-bold text-gray-700">Tarjeta</span>
                        </div>
                    </label>
                </div>

                <div class="bg-gray-50 rounded-3xl p-6 mb-8">
                    <div class="flex justify-between text-gray-500 mb-2">
                        <span>Total a pagar</span>
                        <div class="text-4xl font-black text-amber-900 tracking-tight">$ {{ total }}</div>
                    </div>
                    <div class="text-4xl font-black text-amber-900 tracking-tight">$ --.--</div>
                </div>

                <div class="flex gap-4">
                    <a href="{{ url_for('ventas.index') }}" class="flex-1 text-center py-4 font-bold text-gray-500 hover:text-gray-800 transition-colors">Cancelar</a>
                    <button type="submit" class="flex-[2] bg-amber-800 text-white py-4 rounded-2xl font-bold hover:bg-amber-900 shadow-lg shadow-amber-200 transition-transform active:scale-95">
                        Confirmar y Finalizar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
