{% extends "layout.html" %}
{% block container %}

<div class="w-full max-w-4xl mx-auto p-4">
  <!-- Encabezado -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
        Nueva Compra
      </h2>
      <p class="text-gray-500 dark:text-gray-400 mt-1">
        Registrar compra de materia prima
      </p>
    </div>
    <a href="{{ url_for('compras.listar') }}"
       class="text-white bg-gray-500 box-border border border-transparent hover:bg-gray-600 focus:ring-4 focus:ring-gray-300 shadow-xs font-medium leading-5 rounded-base text-sm px-5 py-2.5 focus:outline-none inline-flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Regresar
    </a>
  </div>

  <!-- Formulario -->
  <div class="bg-white dark:bg-gray-800 rounded-base shadow-xs border border-default p-6">
    <form method="POST" action="{{ url_for('compras.nueva') }}" id="compraForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <!-- Datos de la compra -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            Proveedor <span class="text-red-500">*</span>
          </label>
          <select name="id_proveedor" class="w-full bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 py-2.5" required>
            <option value="">Seleccione un proveedor</option>
            {% for proveedor in proveedores %}
            <option value="{{ proveedor.id_proveedor }}">{{ proveedor.nombre }} ({{ proveedor.RFC }})</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            Fecha de Compra <span class="text-red-500">*</span>
          </label>
          <input type="date" name="fecha" value="{{ datetime.now().strftime('%Y-%m-%d') }}"
                 class="w-full bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 py-2.5" required>
        </div>
      </div>

      <!-- Insumos -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Insumos</h3>
          <button type="button" id="agregarInsumo" 
                  class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2 focus:outline-none">
            + Agregar Insumo
          </button>
        </div>
        
        <div id="insumos-container">
          <div class="insumo-item grid grid-cols-12 gap-3 mb-3 items-end">
            <div class="col-span-5">
              <label class="block text-xs font-medium text-gray-500 mb-1">Materia Prima</label>
              <select name="materia_id[]" class="w-full materia-select bg-neutral-secondary-medium border border-default-medium text-sm rounded-base px-2 py-2" required>
                <option value="">Seleccione</option>
                {% for materia in materias_primas %}
                <option value="{{ materia.id_materia }}" data-unidad="{{ materia.unidad_medida }}">{{ materia.nombre }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-500 mb-1">Cantidad</label>
              <input type="number" name="cantidad[]" step="0.01" class="w-full cantidad-input bg-neutral-secondary-medium border border-default-medium text-sm rounded-base px-2 py-2" placeholder="0.00" required>
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-500 mb-1">Unidad</label>
              <select name="unidad_id[]" class="w-full unidad-select bg-neutral-secondary-medium border border-default-medium text-sm rounded-base px-2 py-2" required>
                <option value="">Seleccione</option>
                {% for unidad in unidades %}
                <option value="{{ unidad.id_unidad }}">{{ unidad.nombre }} ({{ unidad.abreviacion }})</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-500 mb-1">Costo Unitario</label>
              <input type="number" name="costo_unitario[]" step="0.01" class="w-full costo-input bg-neutral-secondary-medium border border-default-medium text-sm rounded-base px-2 py-2" placeholder="0.00" required>
            </div>
            <div class="col-span-1">
              <button type="button" class="eliminar-insumo text-red-600 hover:text-red-800 p-2 mt-5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Total -->
      <div class="border-t border-default pt-4 mt-4">
        <div class="flex justify-end">
          <div class="text-right">
            <p class="text-sm text-gray-500">Total de la Compra</p>
            <p class="text-3xl font-bold text-brand" id="totalCompra">$0.00</p>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-3 mt-6">
        <a href="{{ url_for('compras.listar') }}" 
           class="px-5 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition">
          Cancelar
        </a>
        <button type="submit" 
                class="px-5 py-2 bg-brand text-white rounded-lg hover:bg-brand-strong transition shadow-sm">
          Registrar Compra
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Agregar nuevo insumo
  document.getElementById('agregarInsumo').addEventListener('click', function() {
    const container = document.getElementById('insumos-container');
    const template = document.querySelector('.insumo-item').cloneNode(true);
    
    // Limpiar valores
    template.querySelectorAll('input, select').forEach(input => {
      if (input.tagName === 'SELECT') input.selectedIndex = 0;
      else input.value = '';
    });
    
    container.appendChild(template);
    actualizarTotal();
  });
  
  // Eliminar insumo
  document.addEventListener('click', function(e) {
    if (e.target.closest('.eliminar-insumo')) {
      const items = document.querySelectorAll('.insumo-item');
      if (items.length > 1) {
        e.target.closest('.insumo-item').remove();
        actualizarTotal();
      } else {
        alert('Debe haber al menos un insumo');
      }
    }
  });
  
  // Actualizar total al cambiar valores
  document.addEventListener('change', function(e) {
    if (e.target.matches('.cantidad-input, .costo-input')) {
      actualizarTotal();
    }
  });
  
  document.addEventListener('input', function(e) {
    if (e.target.matches('.cantidad-input, .costo-input')) {
      actualizarTotal();
    }
  });
  
  function actualizarTotal() {
    let total = 0;
    document.querySelectorAll('.insumo-item').forEach(item => {
      const cantidad = parseFloat(item.querySelector('.cantidad-input')?.value) || 0;
      const costo = parseFloat(item.querySelector('.costo-input')?.value) || 0;
      total += cantidad * costo;
    });
    document.getElementById('totalCompra').innerText = '$' + total.toFixed(2);
  }
</script>

{% endblock %}
