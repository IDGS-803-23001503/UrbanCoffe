<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Coffee - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <div class="glass-floating-card">
            
            <div class="header-titles">
                <h1 class="logo-uc">UC</h1>
                <h2 class="logo-text">URBAN COFFEE</h2>
                <h3 class="logo-sub">ADMINISTRATION OF THE SYSTEM</h3>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert-tooltip {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="post" class="form-container">
                <div class="input-line">
                    <i class="far fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <div class="input-line">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit" class="login-btn">LOG IN</button>
            </form>

            <div class="footer-links">
                <a href="#">Forgot your password?</a>
                <a href="#">No account? Register</a>
            </div>

        </div>
    </div>
</body>
</html>
