<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Coffee - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <div class="brand-row">
                <img src="{{ url_for('static', filename='img/urbanCoffeeLogo.jpeg') }}" alt="Urban Coffee" class="brand-logo">
            </div>

            <h1 class="login-title">Ingresa a tu cuenta</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert-message {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="post" class="login-form" autocomplete="on">
                <label for="username">Email</label>
                <input id="username" type="text" name="username" placeholder="nombre@urbancafe.com" required>

                <div class="password-head">
                    <label for="password">Contraseña</label>
                    <a href="#">¿Olvidaste la clave?</a>
                </div>
                <input id="password" type="password" name="password" placeholder="••••••••" required>

                <button type="submit" class="login-btn">Iniciar Sesión</button>
            </form>

            <div class="separator">O ACCEDE CON</div>

            <button type="button" class="google-btn">
                <i class="fa-brands fa-google"></i>
                <span>Google</span>
            </button>
        </section>

        <section class="login-image" aria-hidden="true">
            <img src="{{ url_for('static', filename='img/Caffe Login.jpg') }}" alt="Tazas de café">
        </section>
    </main>
</body>
</html>
